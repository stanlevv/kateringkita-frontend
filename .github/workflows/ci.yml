name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
        with:
          path: fe
      # e2e/ meng-import ../../be/... (tipe saja, untuk typecheck:e2e)
      - uses: actions/checkout@v4
        with:
          repository: stanlevv/kateringkita-backend
          path: be
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            fe/package-lock.json
            be/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: be
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run typecheck:e2e
      - run: npm test
      - run: npm run build
        env:
          BACKEND_API_URL: http://localhost:5000/api/v1
          INTERNAL_API_SECRET: ci-secret-yang-panjangnya-minimal-32-karakter
          SITE_URL: http://localhost:3000
